# zicatAgent 内核 + Web UI：个人自演进 Agent 内核。
# 安装：pip install -e .（必须是 editable）
# 运行：python agentmain.py
#
# 注意：代码用 __file__ 相对定位仓库根下的 assets/ 与 memory/（sys_prompt、
# tools_schema、L1 模板等），这些不是 Python 包。因此只支持 editable 安装，
# 或直接在仓库根目录运行；非 editable 安装到 site-packages 会缺 assets/。

[project]
name = "zicatagent"
version = "0.1.0"
description = "zicatAgent: a local-first self-evolving agent core"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# /scheduler 的进程探测与停止依赖它；不装也能用，只是无法看到运行状态
proc = ["psutil>=5.9"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agentmain", "agent_types", "mykey_loader", "simphtml", "TMWebDriver", "zicat"]
packages = ["core", "engine", "memstore", "reflect", "tools"]
